        mqtt: {$ref: '#/components/schemas/MqttSettings'}
        notifications: {$ref: '#/components/schemas/NotificationSettings'}
        dashboard: {$ref: '#/components/schemas/DashboardSettings'}
        storage_forecast_days: {type: ['integer', 'null'], readOnly: true}
    SettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        interval_per_day: {type: integer, minimum: 1, maximum: 96}
        reaction_time_min: {type: integer, minimum: 1, maximum: 5}
        default_threshold_pct: {type: integer, minimum: 0, maximum: 100}
