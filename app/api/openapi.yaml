              properties:
                enabled: {type: boolean}
                start: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
                end: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
            rules:
              type: object
              additionalProperties: false
              properties:
                needs_water: {type: boolean}
                needs_water_delay_h: {type: integer, minimum: 0, maximum: 72}
                critical: {type: boolean}
                battery_low: {type: boolean}
                offline_h: {type: integer, minimum: 2, maximum: 168}
                daily_summary: {type: ['string', 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
            email:
              type: object
              additionalProperties: false
              properties:
                enabled: {type: boolean}
                host: {type: string, maxLength: 64}
                port: {type: integer, minimum: 1, maximum: 65535}
                security: {type: string, enum: [starttls, tls, none]}
                username: {type: string, maxLength: 64}
                password: {type: string, maxLength: 128, writeOnly: true}
                from: {type: string, maxLength: 80}
                to: {type: string, maxLength: 200}
            ntfy:
              type: object
              additionalProperties: false
              properties:
                enabled: {type: boolean}
                url: {type: string, maxLength: 100}
                topic: {type: string, maxLength: 64}
            webpush:
              type: object
              additionalProperties: false
              properties:
                enabled: {type: boolean, description: 'nur möglich, wenn allowed (Entscheid Auftraggeber, REQ-APP-10)'}
        dashboard:
          type: object
          additionalProperties: false
          properties:
            enabled: {type: boolean}
            public: {type: boolean}
            port: {type: integer, minimum: 1024, maximum: 65535}
            title: {type: string, maxLength: 40}
            show_names: {type: boolean}
            rotate_s: {type: integer, minimum: 5, maximum: 600}
    NotificationSettings:
      type: object
      required: [in_app, badge, rules, email, ntfy, webpush]
      properties:
        in_app: {type: boolean, description: 'Hinweise in der App (strikt lokal)'}
        badge: {type: boolean, description: 'Zähler am App-Symbol (Badging API, lokal)'}
        quiet_hours: {type: object, properties: {enabled: {type: boolean}, start: {type: string}, end: {type: string}}}
        rules:
          type: object
          properties:
            needs_water: {type: boolean}
            needs_water_delay_h: {type: integer}
            critical: {type: boolean}
            battery_low: {type: boolean}
            offline_h: {type: integer}
            daily_summary: {type: ['string', 'null']}
        email:
          type: object
          properties:
            enabled: {type: boolean}
            host: {type: string}
            port: {type: integer}
            security: {type: string, enum: [starttls, tls, none]}
            username: {type: string}
            password_set: {type: boolean, readOnly: true}
            from: {type: string}
            to: {type: string}
        ntfy:
          type: object
          properties:
            enabled: {type: boolean}
            url: {type: string, description: 'ntfy-Server im LAN, z. B. http://ntfy.firma.local'}
            topic: {type: string}
        webpush:
          type: object
          properties:
            enabled: {type: boolean}
            allowed: {type: boolean, readOnly: true, description: 'false bis zum Entscheid (REQ-SYS-01/REQ-APP-10)'}
    DashboardSettings:
      type: object
      required: [enabled, public]
      properties:
        enabled: {type: boolean}
        public: {type: boolean, description: 'ohne Anmeldung lesbar: eigener HTTP-Port (Werk 8080), nur Dashboard, nur lesen (D-020)'}
        port: {type: integer}
        title: {type: string}
        show_names: {type: boolean}
        rotate_s: {type: integer}
    Network:
      type: object
      required: [ssid, connected, hostname]
      properties:
        ssid: {type: string}
        connected: {type: boolean}
        rssi_dbm: {type: ['integer', 'null']}
        ip: {type: ['string', 'null']}
        hostname: {type: string}
        mdns: {type: boolean}
        pending_change: {type: ['object', 'null'], properties: {ssid: {type: string}, deadline: {$ref: '#/components/schemas/Timestamp'}}}
    SensorImage:
      type: object
      required: [version, size, sha256, signature_ok, uploaded]
      properties:
        version: {type: string}
        security_counter: {type: integer, description: Anti-Rollback-Zähler aus dem Abbild-Kopf}
        size: {type: integer}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        signature_ok: {type: boolean}
        hw_compat: {type: string}
        uploaded: {$ref: '#/components/schemas/Timestamp'}
        build: {type: ['integer', 'null'], description: Build-Nummer aus dem MCUboot-Kopf}
        testfw: {type: integer, description: '0 = Serie; n = TESTFIRMWARE TF-n (9 = Testbuild unbekannter Variante). Verteilen nur mit Bestätigung'}
    RolloutItem:
      type: object
      required: [sensor_id, state]
      properties:
        sensor_id: {$ref: '#/components/schemas/SensorId'}
        state: {type: string, enum: [pending, waiting_for_sensor, transferring, verifying, rebooting, done, failed, skipped]}
        progress: {type: number, minimum: 0, maximum: 1}
        message: {type: ['string', 'null']}
    Rollout:
      type: object
      required: [version, started, items]
      properties:
        version: {type: string}
        started: {$ref: '#/components/schemas/Timestamp'}
        finished: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        items:
          type: array
          items: {$ref: '#/components/schemas/RolloutItem'}
    FirmwareState:
      type: object
      required: [gateway, sensor_images, rollout]
      properties:
        gateway:
          type: object
          required: [platform, version, update_slot, secure_boot, storage_encryption]
          properties:
            platform: {type: string, enum: [esp32-s3, rpi-zero2w, mock], description: Gateway-Plattform (offen, siehe ARCHITECTURE.md)}
            version: {type: string}
            build: {type: string}
            update_slot: {type: string, description: 'aktive Update-Partition, z. B. ota_0 (ESP32) oder A (Pi, A/B-Root)'}
            rollback_available: {type: boolean}
            secure_boot: {type: boolean, description: 'nur signierte Gateway-Software startet'}
            storage_encryption: {type: string, enum: ['off', 'development', 'release', 'luks'], description: 'Schutz der Schlüssel/Daten auf dem Speicher'}
            pwa_version: {type: string}
        sensor_images:
          type: array
          items: {$ref: '#/components/schemas/SensorImage'}
        rollout: {oneOf: [{$ref: '#/components/schemas/Rollout'}, {type: 'null'}]}
    RestoreResult:
      type: object
      required: [ok, dry_run]
      properties:
        ok: {type: boolean}
        dry_run: {type: boolean}
        gateway_id: {type: string}
        created: {$ref: '#/components/schemas/Timestamp'}
        plants: {type: integer}
        sensors: {type: integer}
        records: {type: integer}
        reboot_in_s: {type: ['integer', 'null']}
    TimeStatus:
      type: object
      required: [now, valid, source]
      properties:
        now: {$ref: '#/components/schemas/Timestamp'}
        valid: {type: boolean}
        source: {type: string, enum: [ntp, browser, none], description: 'Gateway ohne RTC (D-028)'}
        last_sync: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        timezone: {type: string}
    SystemStatus:
      type: object
      required: [gateway_id, version, uptime_s, time, storage, network, certificate, sensors]
      properties:
        gateway_id: {type: string, description: 'z. B. fluidi-gw-3F9A (REQ-SYS-11)'}
        version: {type: string}
        uptime_s: {type: integer}
        reset_reason: {type: string}
        time: {$ref: '#/components/schemas/TimeStatus'}
        storage:
          type: object
          required: [used_bytes, total_bytes, records, oldest]
          properties:
            used_bytes: {type: integer}
            total_bytes: {type: integer}
            records: {type: integer}
            oldest: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
            forecast_days: {type: ['integer', 'null'], description: 'Tage bis zur Verdichtung bei aktuellem Intervall'}
        network: {$ref: '#/components/schemas/Network'}
        certificate:
          type: object
          required: [not_after, days_left]
          properties:
            not_after: {$ref: '#/components/schemas/Timestamp'}
            days_left: {type: integer}
            fingerprint_sha256: {type: string}
        sensors:
          type: object
          required: [paired, online]
          properties:
            paired: {type: integer}
            online: {type: integer}
        heap:
          type: object
          properties:
            internal_free: {type: integer}
            psram_free: {type: integer}
    EventLogEntry:
      type: object
      required: [id, t, level, code, text]
      properties:
        id: {type: integer}
        t: {$ref: '#/components/schemas/Timestamp'}
        level: {type: string, enum: [info, warn, error]}
        code: {type: string}
        text: {type: string}
        sensor_id: {oneOf: [{$ref: '#/components/schemas/SensorId'}, {type: 'null'}]}
    Series:
      type: object
      required: [plant_id, from, to, res, t, moisture, temp_c]
      properties:
        plant_id: {type: integer}
        from: {type: integer}
        to: {type: integer}
        res: {type: string, enum: [raw, hour, day]}
        timezone: {type: string}
        threshold_pct: {type: integer}
        t: {type: array, items: {type: integer}}
        moisture: {type: array, items: {type: ['number', 'null']}}
        moisture_min: {type: array, items: {type: ['number', 'null']}, description: nur bei hour/day}
        moisture_max: {type: array, items: {type: ['number', 'null']}, description: nur bei hour/day}
        temp_c: {type: array, items: {type: ['number', 'null']}}
        raw: {type: array, items: {type: ['integer', 'null']}, description: nur bei raw}
        flags:
          type: array
          items: {type: integer}
          description: 'nur bei raw; Bit 0 manuell, 1 Zeit rekonstruiert, 2 Zeit unsicher, 3 nachgeliefert, 4 Plausibilität'
        events:
          type: array
          items:
            type: object
            required: [t, type]
            properties:
              t: {type: integer}
              type: {type: string, enum: [calibration, sensor_change, gap, watering, fertilizing]}
              text: {type: string}
