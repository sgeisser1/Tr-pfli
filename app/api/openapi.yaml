        message: {type: ['string', 'null']}
        result: {type: ['object', 'null']}
    PairingCandidate:
      type: object
      required: [device, rssi_dbm, first_seen]
      properties:
        device: {$ref: '#/components/schemas/SensorId'}
        rssi_dbm: {type: integer}
        fw_version: {type: string}
        hw_rev: {type: string}
        first_seen: {$ref: '#/components/schemas/Timestamp'}
        known: {type: boolean, description: 'war früher gekoppelt (Neukopplung)'}
        address: {type: string}
        adv_name: {type: ['string', 'null'], description: 'Gerätename im Advertising (fl-tf<n>-XXXX = Testfirmware)'}
        testfw: {type: integer, description: '0 = Serie, n = Testfirmware TF-n (aus dem Gerätenamen)'}
    PairingState:
      type: object
      required: [active, candidates]
      properties:
        active: {type: boolean}
