        interval_per_day: {type: integer, minimum: 1, maximum: 96, description: REQ-SYS-04, Werk 6}
        reaction_time_min: {type: integer, minimum: 1, maximum: 5, description: REQ-SYS-05}
        default_threshold_pct: {type: integer, minimum: 0, maximum: 100}
