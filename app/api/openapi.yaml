        regime: {type: ['string', 'null'], enum: [A, B, C, D, null], description: 'null = aus der Art'}
        winter_factor: {type: ['number', 'null'], minimum: 0.1, maximum: 1.0}
        winter: {type: boolean, description: 'Winteranpassung für diese Pflanze'}
    PlantPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 40}
        substrate: {$ref: '#/components/schemas/Substrate'}
        threshold_pct: {type: integer, minimum: 0, maximum: 100}
        water_led: {type: string, enum: [inherit, 'on', 'off']}
        notes: {type: string, maxLength: 200}
        species: {type: ['string', 'null']}
        upper_pct: {type: ['integer', 'null'], minimum: 0, maximum: 100}
        location: {type: string, maxLength: 40}
        pot: {$ref: '#/components/schemas/Pot'}
        regime: {type: ['string', 'null'], enum: [A, B, C, D, null], description: 'null = aus der Art'}
        winter_factor: {type: ['number', 'null'], minimum: 0.1, maximum: 1.0}
        winter: {type: boolean, description: 'Winteranpassung für diese Pflanze'}
    Sensor:
      type: object
      required: [id, plant_id, fw_version, last_seen, battery, signal, interval_per_day, effective_interval_per_day, pending_config, error]
      properties:
        id: {$ref: '#/components/schemas/SensorId'}
        plant_id: {type: ['integer', 'null']}
        hw_rev: {type: string}
        fw_version: {type: string}
        paired: {$ref: '#/components/schemas/Timestamp'}
        last_seen: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        battery: {oneOf: [{$ref: '#/components/schemas/Battery'}, {type: 'null'}]}
        signal: {oneOf: [{$ref: '#/components/schemas/Signal'}, {type: 'null'}]}
        interval_per_day: {type: ['integer', 'null'], minimum: 1, maximum: 96, description: 'null = Systemwert'}
        effective_interval_per_day: {type: integer, minimum: 1, maximum: 96}
        led_enabled: {type: boolean}
        pending_config: {type: boolean, description: Änderungen warten auf nächsten Kontakt}
        buffered_records: {type: ['integer', 'null'], description: Werte im Sensorpuffer, noch nicht übertragen}
        error: {type: ['object', 'null'], properties: {code: {type: string}, text: {type: string}, t: {$ref: '#/components/schemas/Timestamp'}}}
        unpairing: {type: boolean}
        address: {type: string, description: 'BLE-Adresse (48 bit) = eindeutige Identität (PROTOCOL 2.3); fluidi-XXXX ist nur 16 bit'}
        lost_records: {type: integer, description: 'im Sensor überschriebene, nie quittierte Werte'}
        reset_reason: {type: ['string', 'null']}
        fw_build: {type: ['integer', 'null'], description: 'Build-Nummer (SESSION_INFO fw_build, PROTOCOL 5.5); Testfirmware 9<n><bb>'}
        testfw: {type: integer, minimum: 0, maximum: 9, description: '0 = Serie; n = TESTFIRMWARE TF-n (Gerätename fl-tf<n>-, fw_build 9<n>xx oder TF-Anhang der Diagnose). Nie im Betrieb'}
        adv_name: {type: ['string', 'null'], description: 'Gerätename im Advertising (Serie fluidi-XXXX, Testfirmware fl-tf<n>-XXXX)'}
        diag_last: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}], description: letzte gespeicherte Diagnose}
    SensorDiag:
      type: object
      description: |
        Ergebnis eines Diagnoseabrufs. Rohdaten = Nutzlast der Antworten INFO (0x90) und DIAG (0x98) als Hex;
        `info`/`diag` dekodiert (null, wenn die Antwort fehlt oder nicht dekodierbar ist – Grund in `decode_errors`).
        Feldnamen wie `scripts/testfw_eval.py --json`; Format TESTFIRMWARE.md Kap. 6.
      required: [sensor_id, address, t, info_hex, diag_hex, info, diag, testfw, decode_errors, decoder]
      properties:
        id: {type: integer}
        sensor_id: {$ref: '#/components/schemas/SensorId'}
        address: {type: string}
        t: {$ref: '#/components/schemas/Timestamp'}
        job_id: {type: ['string', 'null']}
        info_hex: {type: ['string', 'null'], pattern: '^([0-9a-f]{2})*$'}
        diag_hex: {type: ['string', 'null'], pattern: '^([0-9a-f]{2})*$'}
        info:
          type: ['object', 'null']
          description: 'PROTOCOL 5.5 (68 Byte) + Testfirmware-Anhang: testfw, tf_fmt, build_marks_testfw'
          required: [fw, fw_build, hw_rev, boot_id, reset_reason, testfw]
          properties:
            fw: {type: string}
            fw_build: {type: integer}
            hw_rev: {type: integer}
            boot_id: {type: integer}
            uptime_s: {type: integer}
            reset_reason: {type: [string, integer]}
            last_error: {type: integer}
            charge_uc: {type: integer}
            meas: {type: integer}
            adv: {type: integer}
            conn: {type: integer}
            led_ms: {type: integer}
            testfw: {type: integer}
            build_marks_testfw: {type: boolean}
        diag:
          type: ['object', 'null']
          description: 'PROTOCOL 5.7 (Fehlerprotokoll + Zähler) + `tf` = TF-4-Anhang (68 Byte) oder null bei Serie'
          required: [entries, wdt_resets, brownouts, auth_fail, button_stuck, tf]
          properties:
            entries:
              type: array
              maxItems: 16
              items:
                type: object
                required: [code, name, detail, boot_id, uptime_s]
                properties:
                  code: {type: integer}
                  name: {type: string}
                  detail: {type: integer}
                  boot_id: {type: integer}
                  uptime_s: {type: integer}
            wdt_resets: {type: integer}
            brownouts: {type: integer}
            auth_fail: {type: integer}
            button_stuck: {type: integer}
            tf: {type: ['object', 'null']}
        testfw: {type: integer, description: '0 = Serie, n = TF-n'}
        testfw_sources: {type: array, items: {type: string, enum: [info_tail, diag_tail, fw_build, name]}}
        fw_build: {type: ['integer', 'null']}
        fw_version: {type: ['string', 'null']}
        adv_name: {type: ['string', 'null']}
        decode_errors: {type: array, items: {type: string}}
        decoder: {type: string}
    SensorPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        interval_per_day: {type: ['integer', 'null'], minimum: 1, maximum: 96}
        led_enabled: {type: boolean}
    CalibrationPoint:
      type: object
      required: [raw, temp_c]
      properties:
        raw: {type: number, description: Mittelwert, temperaturkompensiert auf t_ref}
        temp_c: {type: ['number', 'null']}
        n: {type: integer}
        stddev: {type: ['number', 'null']}
        t: {$ref: '#/components/schemas/Timestamp'}
    Calibration:
      type: object
      required: [substrate, source, dry, wet]
      properties:
        substrate: {$ref: '#/components/schemas/Substrate'}
        source: {type: string, enum: [default, guided, manual]}
        dry: {$ref: '#/components/schemas/CalibrationPoint'}
        wet: {$ref: '#/components/schemas/CalibrationPoint'}
        temp_coeff_per_k: {type: number, description: 'Platzhalter Temperaturkompensation (relativ, 1/K), Werk 0'}
        t_ref_c: {type: number}
        updated: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
    CalibrationInput:
      type: object
      required: [dry_raw, wet_raw]
      additionalProperties: false
      properties:
        dry_raw: {type: number}
        wet_raw: {type: number}
        temp_coeff_per_k: {type: number, minimum: -0.05, maximum: 0.05}
    CalibrationRun:
      type: object
      required: [id, sensor_id, substrate, state, dry, wet]
      properties:
        id: {type: string}
        sensor_id: {$ref: '#/components/schemas/SensorId'}
        substrate: {$ref: '#/components/schemas/Substrate'}
        samples: {type: integer}
        state: {type: string, enum: [await_dry, measuring_dry, await_wet, measuring_wet, ready, committed, cancelled, failed]}
        dry: {oneOf: [{$ref: '#/components/schemas/CalibrationPoint'}, {type: 'null'}]}
        wet: {oneOf: [{$ref: '#/components/schemas/CalibrationPoint'}, {type: 'null'}]}
        span_ok: {type: ['boolean', 'null']}
        message: {type: ['string', 'null']}
        expires: {$ref: '#/components/schemas/Timestamp'}
    Job:
      type: object
      required: [id, kind, state, created]
      properties:
        id: {type: string}
        kind: {type: string, enum: [measure, calibration_capture, pair, unpair, identify, config, diag]}
        state: {type: string, enum: [queued, waiting_for_sensor, running, awaiting_confirmation, done, failed, timeout, cancelled], description: 'awaiting_confirmation nur bei pair (SAS-Vergleich, result.sas)'}
        sensor_id: {oneOf: [{$ref: '#/components/schemas/SensorId'}, {type: 'null'}]}
        plant_id: {type: ['integer', 'null']}
        created: {$ref: '#/components/schemas/Timestamp'}
        deadline: {$ref: '#/components/schemas/Timestamp'}
