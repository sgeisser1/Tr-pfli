openapi: 3.1.0
info:
  title: fluidi Gateway API
  version: 1.1.0-draft
  summary: Lokale REST-API des fluidi-Gateways (Raspberry Pi Zero 2 W, D-014) für die PWA „fluidi“.
  description: |
    Normativ zusammen mit `docs/interfaces/GATEWAY_API.md` (Abläufe, Sicherheit, Fehlercodes, SSE).
    Strikt lokal: Basis-URL `https://fluidi.local/api/v1`. Alle Zeitangaben in Objekten als
    ISO-8601 UTC (`2026-11-07T14:03:00Z`), in Zeitreihen als Unix-Sekunden (UTC).
    Schreibende Aufrufe (POST/PUT/PATCH/DELETE) brauchen eine Sitzung (Cookie `fluidi_sid`)
    und den Header `X-CSRF-Token`. Aufrufe mit `x-fluidi-elevated: true` brauchen zusätzlich
    eine frische Passwortbestätigung (`POST /auth/elevate`, gültig 5 min).
    Lesende Aufrufe sind ohne Anmeldung erlaubt, solange `settings.public_read` = true
    (Gateway-Werk aus, Mock ein; GATEWAY_API.md Kap. 3.4); sonst ebenfalls Sitzung nötig.
    Öffentliches Dashboard: eigener HTTP-Port (Werk 8080), nur `GET /dashboard` (D-020).
  license:
    name: Projektintern
servers:
  - url: https://fluidi.local/api/v1
    description: Gateway im LAN (mDNS)
  - url: http://localhost:8080/api/v1
    description: Mock-Server für die Entwicklung (app/dev/mock_server.py)
tags:
  - name: auth
  - name: plants
  - name: sensors
  - name: calibration
  - name: jobs
  - name: pairing
  - name: settings
  - name: firmware
  - name: data
  - name: system
  - name: profiles
  - name: journal
  - name: analysis
  - name: roomplan
  - name: dashboard
security:
  - session: []
paths:
  /auth/status:
    get:
      tags: [auth]
      summary: Anmeldestatus, Ersteinrichtung nötig?, Sperre
      security: []
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthStatus'}
  /auth/setup:
    post:
      tags: [auth]
      summary: Erstes Passwort setzen (nur solange setup_required)
      description: |
        Braucht den Einrichtungscode, den das Gateway nur über USB ausgibt
        (Provisionierung bzw. Passwort-Reset UC-16). Danach ist man angemeldet.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setup_code, password]
              additionalProperties: false
              properties:
                setup_code: {type: string, pattern: '^[0-9]{3}-?[0-9]{3}$'}
                password: {$ref: '#/components/schemas/NewPassword'}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Locked'}
  /auth/login:
    post:
      tags: [auth]
      summary: Anmelden
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              additionalProperties: false
              properties:
                password: {type: string, minLength: 1, maxLength: 128}
                remember: {type: boolean, default: false, description: 'true = Sitzung 30 Tage, sonst 12 h'}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Locked'}
  /auth/logout:
    post:
      tags: [auth]
      summary: Abmelden (Sitzung löschen)
      responses:
        '204': {description: abgemeldet}
  /auth/elevate:
    post:
      tags: [auth]
      summary: Passwort erneut bestätigen für heikle Aktionen (5 min)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              additionalProperties: false
              properties:
                password: {type: string, minLength: 1, maxLength: 128}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Locked'}
  /auth/password:
    post:
      tags: [auth]
      summary: Passwort ändern (beendet alle anderen Sitzungen)
      x-fluidi-elevated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              additionalProperties: false
              properties:
                new_password: {$ref: '#/components/schemas/NewPassword'}
      responses:
        '204': {description: geändert}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /plants:
    get:
      tags: [plants]
      summary: Übersicht aller Pflanzen mit letztem Messwert (REQ-APP-03)
      security: [{}, {session: []}]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Plant'}
    post:
      tags: [plants]
      summary: Pflanze anlegen (ohne oder mit Sensor)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlantCreate'}
      responses:
        '201':
          description: angelegt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plant'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /plants/{plant_id}:
    parameters: [{$ref: '#/components/parameters/PlantId'}]
    get:
      tags: [plants]
      summary: Eine Pflanze
      security: [{}, {session: []}]
      responses:
        '200':
          description: Pflanze
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plant'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      tags: [plants]
      summary: Pflanze bearbeiten (Name, Substrat, Schwelle, Giessen-LED) (REQ-APP-05, REQ-UI-07)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlantPatch'}
      responses:
        '200':
          description: geändert
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plant'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [plants]
      summary: Pflanze löschen (Sensor wird frei, Messwerte bleiben beim Sensor)
      responses:
        '204': {description: gelöscht}
        '404': {$ref: '#/components/responses/Error'}
  /plants/{plant_id}/sensor:
    parameters: [{$ref: '#/components/parameters/PlantId'}]
    put:
      tags: [plants]
      summary: Sensor zuordnen, wechseln oder lösen (UC-11)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sensor_id]
              additionalProperties: false
              properties:
                sensor_id: {oneOf: [{$ref: '#/components/schemas/SensorId'}, {type: 'null'}]}
                move_history:
                  type: boolean
                  default: false
                  description: |
                    false = bisherige Messwerte bleiben bei der bisherigen Pflanze (Normalfall).
                    true = die bisherige Historie des Sensors wandert mit zu dieser Pflanze.
      responses:
        '200':
          description: Zuordnung geändert
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plant'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /plants/{plant_id}/series:
    parameters: [{$ref: '#/components/parameters/PlantId'}]
    get:
      tags: [plants]
      summary: Messreihe einer Pflanze, optional aggregiert (REQ-APP-04)
      security: [{}, {session: []}]
      parameters:
        - {name: from, in: query, required: true, schema: {type: integer, description: Unix-Sekunden}}
        - {name: to, in: query, required: true, schema: {type: integer, description: Unix-Sekunden}}
        - name: res
          in: query
          schema: {type: string, enum: [auto, raw, hour, day], default: auto}
      responses:
        '200':
          description: Spaltenformat (direkt für uPlot nutzbar)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Series'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /plants/{plant_id}/measure:
    parameters: [{$ref: '#/components/parameters/PlantId'}]
    post:
      tags: [plants]
      summary: Manuelle Messung auslösen (asynchron, REQ-APP-06, REQ-SYS-05)
      responses:
        '202':
          description: Auftrag angenommen; Fortschritt über GET /jobs/{id} oder SSE `job`
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}

  /sensors:
    get:
      tags: [sensors]
      summary: Alle gekoppelten Sensoren
      security: [{}, {session: []}]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Sensor'}
  /sensors/{sensor_id}:
    parameters: [{$ref: '#/components/parameters/SensorIdParam'}]
    get:
      tags: [sensors]
      summary: Ein Sensor
      security: [{}, {session: []}]
      responses:
        '200':
          description: Sensor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sensor'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      tags: [sensors]
      summary: Sensor-Einstellungen (Intervall-Übersteuerung, LED)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SensorPatch'}
      responses:
        '200':
          description: geändert (wird beim nächsten Kontakt an den Sensor übertragen)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sensor'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [sensors]
      summary: Sensor entkoppeln (Schlüssel löschen; Messwerte bleiben)
      responses:
        '202':
          description: Entkopplung läuft (Sensor wird beim nächsten Kontakt informiert)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '404': {$ref: '#/components/responses/Error'}
  /sensors/{sensor_id}/identify:
    parameters: [{$ref: '#/components/parameters/SensorIdParam'}]
    post:
      tags: [sensors]
      summary: LED des Sensors kurz blinken lassen (Sensor im Raum finden)
      responses:
        '202':
          description: Auftrag angenommen
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '404': {$ref: '#/components/responses/Error'}
  /sensors/{sensor_id}/diag:
    parameters: [{$ref: '#/components/parameters/SensorIdParam'}]
    post:
      tags: [sensors]
      summary: Diagnose abrufen (GET_INFO + GET_DIAG beim nächsten Kontakt, PROTOCOL 5.4/5.5/5.7)
      description: |
        Job `diag` wie „Jetzt messen“: `waiting_for_sensor` → `running` → `done` mit `result` = SensorDiag
        (Rohdaten hex + dekodiert, gespeichert). Nur lesend auf dem Sensor; Sitzung + CSRF (+ Origin), kein elevate.
        Läuft für den Sensor schon ein Abruf, kommt derselbe Job zurück. Mindestabstand 60 s je Sensor (Sicherheit K-4),
        sonst `429 locked` mit `Retry-After`. Dekodierung `firmware/gateway/fluidi_gw/sensordiag.py`
        (dieselbe wie `scripts/testfw_eval.py`).
      responses:
        '202':
          description: Auftrag angenommen
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
    get:
      tags: [sensors]
      summary: Gespeicherte Diagnosen (neueste zuerst; nur mit Sitzung, nie öffentlich)
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 10}}
      responses:
        '200':
          description: neueste zuerst (das Gateway behält 50 je Sensor, auch nach dem Entkoppeln)
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SensorDiag'}
        '404': {$ref: '#/components/responses/Error'}
  /sensors/{sensor_id}/calibration:
    parameters: [{$ref: '#/components/parameters/SensorIdParam'}]
    get:
      tags: [calibration]
      summary: Kalibrierungen des Sensors je Substrat (REQ-MES-09)
      security: [{}, {session: []}]
      responses:
        '200':
          description: je Substrat; `source` = default, wenn noch nicht kalibriert
          content:
            application/json:
              schema:
                type: object
                required: [erde, granulat]
                properties:
                  erde: {$ref: '#/components/schemas/Calibration'}
                  granulat: {$ref: '#/components/schemas/Calibration'}
  /sensors/{sensor_id}/calibration/{substrate}:
    parameters:
      - {$ref: '#/components/parameters/SensorIdParam'}
      - {name: substrate, in: path, required: true, schema: {$ref: '#/components/schemas/Substrate'}}
    put:
      tags: [calibration]
      summary: Kalibrierwerte direkt setzen (Fachmodus)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CalibrationInput'}
      responses:
        '200':
          description: gespeichert
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Calibration'}
        '400': {$ref: '#/components/responses/Error'}
    delete:
      tags: [calibration]
      summary: Auf Startkalibrierung zurücksetzen
      responses:
        '200':
          description: zurückgesetzt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Calibration'}
  /sensors/{sensor_id}/calibration-runs:
    parameters: [{$ref: '#/components/parameters/SensorIdParam'}]
    get:
      tags: [calibration]
      summary: Offener Kalibrierlauf des Sensors (0 oder 1) – Fortsetzen nach Seitenverlust (Red Team W-6)
      description: |
        Offene Läufe bleiben im Gateway bis `expires` (6 h nach dem Start), auch über einen Neustart des Gateways
        (eine dabei unterbrochene Messung muss wiederholt werden, `message`). Abgelaufene Läufe werden `cancelled`.
      responses:
        '200':
          description: offene Läufe (höchstens einer)
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CalibrationRun'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      tags: [calibration]
      summary: Geführte Zwei-Punkt-Kalibrierung starten (REQ-APP-07)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [substrate]
              additionalProperties: false
              properties:
                substrate: {$ref: '#/components/schemas/Substrate'}
                samples: {type: integer, minimum: 3, maximum: 20, default: 5}
      responses:
        '201':
          description: Lauf angelegt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalibrationRun'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /calibration-runs/{run_id}:
    parameters: [{name: run_id, in: path, required: true, schema: {type: string}}]
    get:
      tags: [calibration]
      summary: Stand eines Kalibrierlaufs
      responses:
        '200':
          description: Lauf
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalibrationRun'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [calibration]
      summary: Lauf abbrechen (nichts wird gespeichert)
      responses:
        '204': {description: abgebrochen}
  /calibration-runs/{run_id}/capture:
    parameters: [{name: run_id, in: path, required: true, schema: {type: string}}]
    post:
      tags: [calibration]
      summary: Messpunkt „trocken“ oder „nass“ aufnehmen (mehrere Einzelmessungen)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [point]
              additionalProperties: false
              properties:
                point: {type: string, enum: [dry, wet]}
      responses:
        '202':
          description: Messauftrag läuft; Ergebnis landet im Lauf (`dry`/`wet`)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /calibration-runs/{run_id}/commit:
    parameters: [{name: run_id, in: path, required: true, schema: {type: string}}]
    post:
      tags: [calibration]
      summary: Kalibrierung übernehmen
      responses:
        '200':
          description: gespeichert
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Calibration'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}

  /jobs/{job_id}:
    parameters: [{name: job_id, in: path, required: true, schema: {type: string}}]
    get:
      tags: [jobs]
      summary: Status eines asynchronen Auftrags
      security: [{}, {session: []}]
      responses:
        '200':
          description: Auftrag
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '404': {$ref: '#/components/responses/Error'}

  /pairing:
    get:
      tags: [pairing]
      summary: Kopplungsmodus und gefundene Sensoren im Kopplungsmodus
      responses:
        '200':
          description: Zustand
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PairingState'}
  /pairing/start:
    post:
      tags: [pairing]
      summary: Kopplungsmodus des Gateways öffnen (max. 300 s)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                duration_s: {type: integer, minimum: 30, maximum: 300, default: 180}
      responses:
        '200':
          description: geöffnet
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PairingState'}
  /pairing/stop:
    post:
      tags: [pairing]
      summary: Kopplungsmodus schliessen
      responses:
        '200':
          description: geschlossen
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PairingState'}
  /pairing/candidates/{device}/accept:
    parameters: [{name: device, in: path, required: true, schema: {$ref: '#/components/schemas/SensorId'}}]
    post:
      tags: [pairing]
      summary: Gefundenen Sensor bestätigen und koppeln (REQ-RF-05)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                plant_id: {type: integer, description: bestehende Pflanze ohne Sensor}
                plant: {$ref: '#/components/schemas/PlantCreate'}
      responses:
        '202':
          description: Schlüsselaustausch läuft; Job-Ergebnis enthält sensor_id und plant_id
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}

  /settings:
    get:
      tags: [settings]
      summary: Systemweite Einstellungen
      security: [{}, {session: []}]
      responses:
        '200':
          description: Einstellungen (Passwortfelder nie enthalten)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Settings'}
    patch:
      tags: [settings]
      summary: Einstellungen ändern (teilweise)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SettingsPatch'}
      responses:
        '200':
          description: geändert
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Settings'}
        '400': {$ref: '#/components/responses/Error'}
  /settings/network:
    get:
      tags: [settings]
      summary: WLAN-Verbindung (ohne Passwort)
      responses:
        '200':
          description: WLAN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Network'}
    put:
      tags: [settings]
      summary: WLAN wechseln (UC-13); Rückfall auf alte Daten nach 120 s ohne Erfolg
      x-fluidi-elevated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ssid, password]
              additionalProperties: false
              properties:
                ssid: {type: string, minLength: 1, maxLength: 32}
                password: {type: string, minLength: 8, maxLength: 63, writeOnly: true}
      responses:
        '202':
          description: Wechsel wird versucht
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Network'}

  /firmware:
    get:
      tags: [firmware]
      summary: Firmware-Stand Gateway, abgelegte Sensor-Abbilder, laufende Verteilung
      responses:
        '200':
          description: Stand
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FirmwareState'}
  /firmware/sensor-images:
    post:
      tags: [firmware]
      summary: Signiertes Sensor-Abbild hochladen (Gateway prüft Signatur und Version)
      description: |
        Testfirmware (Build 9000–9999 im signierten Kopf, bzw. Dateiname `-tf<n>-`, TESTFIRMWARE.md Kap. 3) wird nur
        mit `allow_testfw = true` in gateway.toml angenommen (sonst 403) und als `testfw: n` markiert (Sicherheit W-2).
      x-fluidi-elevated: true
      parameters:
        - {name: filename, in: query, required: false, schema: {type: string, maxLength: 200}, description: 'Original-Dateiname (zusätzliches TF-Merkmal)'}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '201':
          description: abgelegt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SensorImage'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /firmware/sensor-images/{version}:
    parameters: [{name: version, in: path, required: true, schema: {type: string}}]
    delete:
      tags: [firmware]
      summary: Abgelegtes Sensor-Abbild löschen
      responses:
        '204': {description: gelöscht}
        '404': {$ref: '#/components/responses/Error'}
  /firmware/rollout:
    post:
      tags: [firmware]
      summary: Sensor-Update verteilen (UC-08)
      x-fluidi-elevated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, sensor_ids]
              additionalProperties: false
              properties:
                version: {type: string}
                sensor_ids:
                  type: array
                  minItems: 1
                  items: {$ref: '#/components/schemas/SensorId'}
                confirm_testfw:
                  $ref: '#/components/schemas/SensorId'
                  description: "Pflicht bei Testfirmware (W-2): genau ein Sensor, hier dessen Kennung als ausdrückliche Bestätigung; sonst 409 confirmation_required"
      responses:
        '202':
          description: Verteilung gestartet
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Rollout'}
        '404': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      tags: [firmware]
      summary: Verteilung abbrechen (laufende Übertragungen werden sauber beendet)
      responses:
        '204': {description: abgebrochen}
  /firmware/gateway:
    post:
      tags: [firmware]
      summary: Gateway-Update (signiertes Abbild inkl. PWA), A/B mit Rückfall (REQ-GW-11)
      x-fluidi-elevated: true
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '202':
          description: geprüft und geschrieben, Neustart folgt
          content:
            application/json:
              schema:
                type: object
                required: [version, reboot_in_s]
                properties:
                  version: {type: string}
                  reboot_in_s: {type: integer}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}

  /export.csv:
    get:
      tags: [data]
      summary: CSV-Export (REQ-APP-08), Format `fluidi-csv` v1
      security: [{}, {session: []}]
      parameters:
        - name: plant_ids
          in: query
          description: Kommagetrennte IDs; leer = alle
          schema: {type: string, pattern: '^([0-9]+(,[0-9]+)*)?$'}
        - {name: from, in: query, required: true, schema: {type: integer}}
        - {name: to, in: query, required: true, schema: {type: integer}}
        - {name: res, in: query, schema: {type: string, enum: [raw, hour, day], default: raw}}
        - {name: sep, in: query, schema: {type: string, enum: [semicolon, comma], default: semicolon}}
        - {name: decimal, in: query, schema: {type: string, enum: [point, comma], default: point}}
      responses:
        '200':
          description: CSV, UTF-8 mit BOM, Kopfzeile `# fluidi-csv v1`
          content:
            text/csv:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Error'}
  /backup:
    post:
      tags: [data]
      summary: Vollständiges Backup erzeugen (inkl. Kopplungsschlüssel, verschlüsselt) (REQ-GW-06)
      x-fluidi-elevated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passphrase]
              additionalProperties: false
              properties:
                passphrase: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
      responses:
        '200':
          description: Datei `fluidi-backup-<gateway>-<datum>.fbk`
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
  /backup/restore:
    post:
      tags: [data]
      summary: Backup einspielen (ersetzt alle Daten), danach Neustart (UC-14)
      x-fluidi-elevated: true
      parameters:
        - {name: X-Backup-Passphrase, in: header, required: true, schema: {type: string, minLength: 12}}
        - {name: dry_run, in: query, schema: {type: boolean, default: false}}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '202':
          description: geprüft (und bei dry_run=false eingespielt)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RestoreResult'}
        '422': {$ref: '#/components/responses/Error'}

  /system:
    get:
      tags: [system]
      summary: Systemstatus (Zeit, Speicher, WLAN, Zertifikat, Version)
      security: [{}, {session: []}]
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SystemStatus'}
  /system/time:
    post:
      tags: [system]
      summary: Browserzeit übergeben (nur übernommen, wenn das Gateway keine gültige Zeit hat)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'Genau eines von epoch_ms oder t. Zeiten vor 2026-01-01 oder ab 2100 werden mit 400 abgelehnt (phase5_gateway_zeit.md).'
              additionalProperties: false
              properties:
                epoch_ms: {type: integer, description: 'Unix-Zeit in ms'}
                t: {type: string, format: date-time, description: 'ISO 8601 (so sendet es die PWA)'}
                force: {type: boolean, default: false, description: 'true = auch bei gültiger Zeit übernehmen (nur mit elevate)'}
      responses:
        '200':
          description: Zeitstatus nach dem Aufruf
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TimeStatus'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /system/reboot:
    post:
      tags: [system]
      summary: Gateway neu starten
      responses:
        '202': {description: Neustart in 2 s}
  /system/events:
    get:
      tags: [system]
      summary: Ereignisprotokoll (Sensorfehler, Neustarts, Anmeldefehler, Updates)
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: before, in: query, schema: {type: integer, description: 'Ereignis-ID, ältere als diese'}}
      responses:
        '200':
          description: neueste zuerst
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/EventLogEntry'}
  /stream:
    get:
      tags: [system]
      summary: Server-Sent Events (measurement, plant, job, pairing, rollout, system)
      security: [{}, {session: []}]
      responses:
        '200':
          description: 'text/event-stream; Ereignisdaten siehe GATEWAY_API.md Kap. 6'
          content:
            text/event-stream:
              schema: {type: string}

  # ---------------------------------------------------------------- Konzept-Erweiterung (SOFTWARE_CONCEPT.md)
  /species:
    get:
      tags: [profiles]
      summary: Eingebaute Pflanzenvorlagen (nur Startwerte, keine Pflegeempfehlungen)
      security: [{}, {session: []}]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Species'}
  /plants/{plant_id}/journal:
    parameters: [{$ref: '#/components/parameters/PlantId'}]
    get:
      tags: [journal]
      summary: Giess-Tagebuch (gespeicherte Einträge + vom Sensor erkannte Giessungen), neueste zuerst
      security: [{}, {session: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
        - {name: include_rejected, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: Einträge
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/JournalEntry'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      tags: [journal]
      summary: Eintrag anlegen, z. B. Knopf „gegossen“ (ohne t = jetzt; Gateway fordert danach eine Messung an)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JournalCreate'}
      responses:
        '201':
          description: angelegt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JournalEntry'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /journal/{entry_id}:
    parameters:
      - {name: entry_id, in: path, required: true, schema: {type: string, maxLength: 40}}
    patch:
      tags: [journal]
      summary: Eintrag ändern; erkannte Giessung bestätigen oder verwerfen
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JournalPatch'}
      responses:
        '200':
          description: geändert
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JournalEntry'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [journal]
      summary: Eigenen Eintrag löschen (erkannte Giessungen nur verwerfen, 409)
      responses:
        '204': {description: gelöscht}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /plants/{plant_id}/forecast:
    parameters: [{$ref: '#/components/parameters/PlantId'}]
    get:
      tags: [analysis]
      summary: Prognose „nächstes Giessen“ mit Kurve, Intervall und Zyklen (SOFTWARE_CONCEPT Kap. 7)
      security: [{}, {session: []}]
      responses:
        '200':
          description: Prognose
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ForecastDetail'}
        '404': {$ref: '#/components/responses/Error'}
  /roomplan:
    get:
      tags: [roomplan]
      summary: Raumplan (Räume, Fenster/Türen, Sonnenseite, Möbel, Pflanzenpositionen)
      security: [{}, {session: []}]
      responses:
        '200':
          description: Plan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoomPlan'}
    put:
      tags: [roomplan]
      summary: Raumplan speichern (optimistische Sperre über version)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RoomPlan'}
      responses:
        '200':
          description: gespeichert, version + 1
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoomPlan'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /stats:
    get:
      tags: [analysis]
      summary: Statistik (Giessungen, Zeit im Zielbereich, Batterie, Energie, Funk) – serverseitig verdichtet
      security: [{}, {session: []}]
      parameters:
        - {name: days, in: query, schema: {type: integer, minimum: 7, maximum: 730, default: 90}}
      responses:
        '200':
          description: Statistik
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Stats'}
  /alerts:
    get:
      tags: [analysis]
      summary: Aktuelle Hinweise (In-App-Benachrichtigungen, Badge-Zähler), kritisch zuerst
      security: [{}, {session: []}]
      responses:
        '200':
          description: Hinweise
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Alert'}
  /dashboard:
    get:
      tags: [dashboard]
      summary: Nur-Lese-Zusammenfassung für TV/Kollegen (ohne Sensor-IDs und Systemdaten)
      description: |
        Öffentlich ohne Anmeldung nur, wenn `settings.dashboard.public` = true. Auf dem Gateway zusätzlich
        über einen eigenen Port (`settings.dashboard.port`), der nur diese Route und die statische
        Dashboard-Seite ausliefert (SOFTWARE_CONCEPT Kap. 10).
      security: [{}, {session: []}]
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dashboard'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  # ---------------------------------------------------------------- Welle 2 (Gateway Pi, PWA Frost)
  /pairing/candidates/{device}/confirm:
    parameters: [{name: device, in: path, required: true, schema: {$ref: '#/components/schemas/SensorId'}}]
    post:
      tags: [pairing]
      summary: Farbfolge (SAS) bestätigen oder ablehnen (PROTOCOL 4.2, REQ-RF-05)
      description: |
        Nach `accept` geht der Job `pair` in den Zustand `awaiting_confirmation`; `result.sas` enthält die fünf
        Farben (rot/grün/gelb), die auch die Sensor-LED zeigt. Der Nutzer drückt kurz die Sensortaste UND
        bestätigt hier. `match=false` bricht die Kopplung ab (möglicher Angriff). Frist 60 s.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [match]
              additionalProperties: false
              properties:
                match: {type: boolean}
      responses:
        '202':
          description: Bestätigung übernommen; Job läuft weiter
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /climate:
    get:
      tags: [system]
      summary: Raumklima am Gateway (D-017, SHT4x), letzter Wert und Verlauf (> 3 Tage als Stundenmittel)
      security: [{}, {session: []}]
      parameters:
        - {name: from, in: query, schema: {type: integer}, description: 'Unix-s, Standard jetzt − 7 Tage'}
        - {name: to, in: query, schema: {type: integer}}
      responses:
        '200':
          description: Klima
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Climate'}

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: fluidi_sid
  parameters:
    PlantId:
      name: plant_id
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    SensorIdParam:
      name: sensor_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/SensorId'}
  responses:
    Error:
      description: Fehler
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Locked:
      description: Zu viele Fehlversuche; Header Retry-After (s)
      headers:
        Retry-After: {schema: {type: integer}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Session:
      description: Angemeldet; setzt Cookie `fluidi_sid` (HttpOnly, Secure, SameSite=Strict)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Session'}
  schemas:
    Timestamp: {type: string, format: date-time}
    SensorId:
      type: string
      pattern: '^fluidi-[0-9A-F]{4}$'
      description: REQ-SYS-08, XXXX aus Chip-ID (hex)
    Substrate:
      type: string
      enum: [erde, granulat]
    NewPassword:
      type: string
      minLength: 10
      maxLength: 128
      writeOnly: true
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, validation, auth_required, auth_failed, csrf, elevation_required,
                     locked, forbidden, not_found, conflict, setup_done, setup_required,
                     signature_invalid, downgrade, too_large, sensor_unreachable, busy,
                     calibration_span, time_invalid, internal]
            message: {type: string, description: Deutsch, für die Anzeige}
            field: {type: string}
            retry_after_s: {type: integer}
    AuthStatus:
      type: object
      required: [setup_required, logged_in, public_read, lockout]
      properties:
        setup_required: {type: boolean}
        logged_in: {type: boolean}
        elevated_until: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        session_expires: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        csrf: {type: ['string', 'null'], description: nur wenn angemeldet}
        public_read: {type: boolean}
        lockout:
          type: object
          required: [locked]
          properties:
            locked: {type: boolean}
            retry_after_s: {type: integer}
            failed_attempts: {type: integer}
    Session:
      type: object
      required: [csrf, expires]
      properties:
        csrf: {type: string}
        expires: {$ref: '#/components/schemas/Timestamp'}
        elevated_until: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
    Battery:
      type: object
      required: [mv, pct, state]
      properties:
        mv: {type: integer, description: Spannung unter Last (REQ-ENE-05)}
        pct: {type: integer, minimum: 0, maximum: 100}
        days_left: {type: ['integer', 'null'], description: Schätzung des Gateways}
        state: {type: string, enum: [ok, low, critical]}
    Signal:
      type: object
      required: [rssi_dbm, quality]
      properties:
        rssi_dbm: {type: integer, description: am Gateway empfangen}
        quality: {type: integer, minimum: 0, maximum: 4}
    Reading:
      type: object
      required: [t, moisture_pct, moisture_state, raw, temp_c, time_quality]
      properties:
        t: {$ref: '#/components/schemas/Timestamp'}
        moisture_pct: {type: ['number', 'null'], description: 'Feuchteindex 0–100 %, 0.1 % Auflösung; null bei air/flooded'}
        moisture_unclamped: {type: ['number', 'null']}
        moisture_state: {type: string, enum: [ok, dry, air, flooded, uncalibrated, invalid]}
        raw: {type: integer, description: Rohwert des Sensors}
        temp_c: {type: ['number', 'null']}
        time_quality: {type: string, enum: [ok, reconstructed, unsynced]}
        source: {type: string, enum: [auto, manual, button, calibration]}
    PlantStatus:
      type: object
      required: [needs_water, stale, battery_low, sensor_error]
      properties:
        needs_water: {type: boolean}
        stale: {type: boolean, description: 'kein Wert seit > 3 Intervallen'}
        battery_low: {type: boolean}
        sensor_error: {type: ['string', 'null']}
    Plant:
      type: object
      required: [id, name, substrate, threshold_pct, water_led, sensor_id, latest, status, calibration]
      properties:
        id: {type: integer}
        name: {type: string, minLength: 1, maxLength: 40}
        substrate: {$ref: '#/components/schemas/Substrate'}
        threshold_pct: {type: integer, minimum: 0, maximum: 100}
        water_led: {type: string, enum: [inherit, 'on', 'off'], description: Giessen-Hinweis an der LED (REQ-UI-07)}
        notes: {type: string, maxLength: 200}
        sensor_id: {oneOf: [{$ref: '#/components/schemas/SensorId'}, {type: 'null'}]}
        latest: {oneOf: [{$ref: '#/components/schemas/Reading'}, {type: 'null'}]}
        status: {$ref: '#/components/schemas/PlantStatus'}
        battery: {oneOf: [{$ref: '#/components/schemas/Battery'}, {type: 'null'}]}
        signal: {oneOf: [{$ref: '#/components/schemas/Signal'}, {type: 'null'}]}
        calibration: {type: string, enum: [none, default, calibrated]}
        created: {$ref: '#/components/schemas/Timestamp'}
        species: {type: ['string', 'null'], description: 'Schlüssel aus GET /species'}
        upper_pct: {type: ['integer', 'null'], minimum: 0, maximum: 100, description: 'Obergrenze des Zielbereichs (zu nass)'}
        location: {type: string, maxLength: 40}
        pot: {$ref: '#/components/schemas/Pot'}
        forecast: {$ref: '#/components/schemas/ForecastSummary'}
        last_watered: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        mood: {$ref: '#/components/schemas/Mood'}
        regime: {type: string, enum: [A, B, C, D], description: 'Giessverhalten (PFLANZENPROFILE.md): A abtrocknen, B oben abtrocknen, C gleichmässig feucht, D Sonderfall'}
        winter_factor: {type: ['number', 'null'], description: 'Winterschwelle = Schwelle × Faktor in den Wintermonaten (ANNAHME)'}
        care: {$ref: '#/components/schemas/Care'}
        salt: {$ref: '#/components/schemas/Salt'}
    Care:
      type: object
      description: 'Regime-Hinweise (PFLANZENPROFILE Kap. 4.3); „zu nass“ erst 48 h nach der letzten Giessung (D-021)'
      properties:
        regime: {type: string, enum: [A, B, C, D]}
        phase: {type: ['string', 'null'], enum: [dry_phase, null]}
        too_wet: {type: boolean}
        winter_active: {type: boolean}
        effective_threshold_pct: {type: integer, description: 'wirksame Giessschwelle (Winterfaktor berücksichtigt)'}
        hints:
          type: array
          items:
            type: object
            required: [kind, level, text]
            properties:
              kind: {type: string, enum: [too_wet, dry_phase, soon, early, not_thorough, reminder, hydro, winter]}
              level: {type: string, enum: [info, warn]}
              text: {type: string}
    Salt:
      type: object
      description: 'Dünger-/Salzhinweis aus der Zeitreihe (D-018, MESSKETTE_SALZ A+): Spitze nach dem Giessen > 130 % (ANNAHME, OP-K3)'
      properties:
        state: {type: string, enum: [none, fertilized, suspected]}
        peak_pct: {type: ['number', 'null']}
        since: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        last_fertilized: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        text: {type: ['string', 'null']}
    Climate:
      type: object
      required: [source, latest, t, temp_c, rh_pct]
      properties:
        source: {type: string, enum: [sht4x, sim, 'off']}
        latest:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                t: {$ref: '#/components/schemas/Timestamp'}
                temp_c: {type: number}
                rh_pct: {type: number}
                source: {type: string}
        from: {type: integer}
        to: {type: integer}
        t: {type: array, items: {type: integer}}
        temp_c: {type: array, items: {type: number}}
        rh_pct: {type: array, items: {type: number}}
    Pot:
      type: ['object', 'null']
      additionalProperties: false
      properties:
        diameter_cm: {type: ['integer', 'null'], minimum: 4, maximum: 120}
        material: {type: ['string', 'null'], enum: [kunststoff, ton, keramik, andere, null]}
        drainage: {type: boolean}
    Mood:
      type: string
      enum: [happy, ok, thirsty, parched, drowning, confused, sleepy, unknown]
      description: Stimmung des Tropfen-Charakters (SOFTWARE_CONCEPT Kap. 7.5), immer mit Text angezeigt
    ForecastSummary:
      type: object
      required: [state, next_water, days, confidence]
      properties:
        state: {type: string, enum: [ok, due, insufficient_data, not_applicable]}
        next_water: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        days: {type: ['number', 'null'], description: 'Tage ab jetzt bis zur Giessschwelle'}
        days_low: {type: ['number', 'null']}
        days_high: {type: ['number', 'null']}
        confidence: {type: ['string', 'null'], enum: [low, medium, high, null]}
    ForecastDetail:
      allOf:
        - {$ref: '#/components/schemas/ForecastSummary'}
        - type: object
          required: [plant_id, method, explanation, cycles]
          properties:
            plant_id: {type: integer}
            method: {type: string, enum: [exp]}
            threshold_pct: {type: integer}
            k_per_day: {type: ['number', 'null'], description: 'Austrocknungsrate (1/Tag), Median der Zyklen'}
            cycles_used: {type: integer}
            r2: {type: ['number', 'null']}
            explanation: {type: string, description: 'Klartext für die Anzeige'}
            curve:
              type: ['object', 'null']
              properties:
                t: {type: array, items: {type: integer}}
                moisture: {type: array, items: {type: number}}
                threshold_pct: {type: integer}
            cycles:
              type: array
              items:
                type: object
                required: [start, k_per_day, r2]
                properties:
                  start: {$ref: '#/components/schemas/Timestamp'}
                  k_per_day: {type: number}
                  r2: {type: number}
                  current: {type: boolean}
    Species:
      type: object
      description: 'Artenprofil aus app/data/species.json (Quelle docs/software/PFLANZENPROFILE.md, D-021). Klasse/Regime/Abtrocknung aus Quellen, alle Prozentwerte Startwerte (ANNAHME).'
      required: [key, name, water_class, start_range, source]
      properties:
        key: {type: string}
        name: {type: string}
        latin: {type: string}
        water_class: {type: ['string', 'null'], enum: [dry, medium, moist, null], description: 'trocken/mittel/feucht (D-020); null bei Regime D'}
        water_class_text: {type: string}
        start_range:
