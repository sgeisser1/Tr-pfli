#!/usr/sbin/nft -f
# fluidi Gateway – Firewall (REQ-SAF-NET-02/03, ARCHITECTURE Kap. 9): eingehend nur 80/443/8080 + mDNS + DHCP.
# Ausgehend frei (NTP, apt nur bei Wartung). SSH (22) nur während der Einrichtung (install_gateway.sh --finish entfernt die Zeile).
flush ruleset
table inet fluidi {
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ct state invalid drop
    meta l4proto { icmp, ipv6-icmp } accept
    udp dport 5353 accept comment "mDNS fluidi.local"
    udp sport 67 udp dport 68 accept comment "DHCP"
    udp sport 547 udp dport 546 accept comment "DHCPv6"
    tcp dport { 80, 443 } accept comment "PWA/API (80 nur Weiterleitung + CA)"
    tcp dport 8080 accept comment "oeffentliches Dashboard (nur aktiv, wenn in der PWA freigegeben)"
    tcp dport 22 accept comment "SSH-EINRICHTUNG"
  }
  chain forward { type filter hook forward priority 0; policy drop; }
  chain output { type filter hook output priority 0; policy accept; }
}
